site_name: Sinlib
site_description: Sinhala NLP toolkit — phonological tokenization, spell checking, and more
site_author: Ransaka Ravihara
site_url: https://sinlib.readthedocs.io

repo_url: https://github.com/Ransaka/sinlib
repo_name: Ransaka/sinlib
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: docs/custom_theme
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow

plugins:
  - search:
      separator: '[\s\-\.]'
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            docstring_style: google
            merge_init_into_class: true
  - mkdocs-jupyter:
      include_source: true
      execute: false
      ignore_h1_titles: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets
  - pymdownx.details
  - admonition
  - footnotes
  - attr_list
  - md_in_html
  - def_list
  - toc:
      permalink: true
      toc_depth: 3

extra_css:
  - css/custom.css
  - css/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Ransaka/sinlib
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/sinlib/
  analytics:
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: Thanks for letting us know.

nav:
  - Home: index.md
  - API Reference:
    - api/index.md
    - Tokenizer: api/tokenizer.md
    - BatchEncoding: api/encoding.md
    - TypoDetector: api/spellcheck.md
    - Preprocessing: api/preprocessing.md
  - Guides:
    - guides/index.md
    - Tokenization: guides/tokenization.md
    - Spell Checking: guides/spellcheck.md
  - Examples:
    - Tokenization: examples/Tokenization Example.md
    - Typo Correction: examples/Typo Correction.md
